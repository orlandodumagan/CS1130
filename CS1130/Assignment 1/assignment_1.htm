<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignment #1 - Conversion - CS 1130</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="topnav"><a href="../index.html">&#8962; Home</a></div>
<header>
  <h1>Assignment #1 - Conversion</h1>
  <p>Celsius to Fahrenheit, Fahrenheit to Celsius, Meters to Feet, Feet to Meters.</p>
</header>
<main>
  <section>
    <h2>Temperature</h2>
    <div class="row">
      <label>Celsius (&deg;C)<input type="number" id="c" step="any"></label>
      <button onclick="cToF()">Convert to &deg;F</button>
    </div>
    <div class="out" id="o1a" aria-live="polite"></div>
    <div class="row">
      <label>Fahrenheit (&deg;F)<input type="number" id="f" step="any"></label>
      <button onclick="fToC()">Convert to &deg;C</button>
    </div>
    <div class="out" id="o1b" aria-live="polite"></div>

    <h2>Length</h2>
    <div class="row">
      <label>Meters (m)<input type="number" id="m" step="any"></label>
      <button onclick="mToFt()">Convert to feet</button>
    </div>
    <div class="out" id="o1c" aria-live="polite"></div>
    <div class="row">
      <label>Feet (ft)<input type="number" id="ft" step="any"></label>
      <button onclick="ftToM()">Convert to meters</button>
    </div>
    <div class="out" id="o1d" aria-live="polite"></div>
  </section>
</main>
<footer>CS 1130 - Computer Studies Division, Ateneo de Davao University</footer>
<script src="assignment_1.js"></script>
</body>
</html>
